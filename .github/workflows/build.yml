name: Build termux-sample

on:
  push:
    paths:
      - 'project/**'
      - 'packages/termux-sample/build.sh'
      - '.github/workflows/build.yml'
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── Optimización #1: Caché de imagen Docker ───
      - name: Cache Docker image
        id: docker-cache
        uses: actions/cache@v4
        with:
          path: /tmp/docker-image.tar
          key: docker-package-builder-v1

      - name: Load or pull Docker image
        run: |
          if [ -f /tmp/docker-image.tar ]; then
            echo "✅ Loading cached Docker image..."
            docker load -i /tmp/docker-image.tar
          else
            echo "📥 Pulling Docker image (first time)..."
            docker pull ghcr.io/termux/package-builder
            echo "💾 Saving Docker image to cache..."
            docker save ghcr.io/termux/package-builder -o /tmp/docker-image.tar
          fi

      # ─── Optimización #2: Cache key preciso ───
      # Usamos una ruta en el workspace del host (escribible)
      # que luego montamos dentro del contenedor
      - name: Restore build cache (incremental)
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.termux-build-cache
          key: termux-build-${{ hashFiles('project/**', 'packages/termux-sample/build.sh') }}
          restore-keys: |
            termux-build-

      - name: Ensure cache directory exists
        run: mkdir -p ${{ github.workspace }}/.termux-build-cache

      - name: Build package for aarch64
        run: |
          docker run --rm --privileged \
            -v ${{ github.workspace }}:/home/builder/proot-termux \
            -v ${{ github.workspace }}/.termux-build-cache:/home/builder/.termux-build \
            -e HOME=/home/builder \
            ghcr.io/termux/package-builder \
            bash -c "
              cd /home/builder/proot-termux && \
              ./build-package.sh -I -a aarch64 termux-sample
            "

      - name: Collect artifact (.deb)
        if: always()
        run: |
          mkdir -p ./artifacts
          find ${{ github.workspace }}/.termux-build-cache -name "*.deb" -exec cp {} ./artifacts/ \; 2>/dev/null || echo "No .deb found"
          ls -la ./artifacts/ 2>/dev/null || echo "No artifacts"

      - name: Upload .deb artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termux-sample-${{ github.sha }}
          path: ./artifacts/*.deb
          retention-days: 7

      - name: Build summary
        if: always()
        run: |
          cat <<'SUMMARY' >> $GITHUB_STEP_SUMMARY
          # 🏗️ Build termux-sample

          | Detalle | Valor |
          |---|---|
          | Commit | ${{ github.sha }} |
          | Branch | ${{ github.ref_name }} |
          | Arquitectura | aarch64 |
          | Docker cache | ✅ (save/load) |
          | Cache key | `termux-build-${{ hashFiles('project/**', 'packages/termux-sample/build.sh') }}` |
          | Cache hit | ${{ steps.cache.outputs.cache-hit }} |

          ## 📁 Cambios que activaron el build
          ```
          ${{ github.event.before }} → ${{ github.sha }}
          ```

          ## 📦 Package: termux-sample
          - Source: `project/` (trackeado local)
          - Build: `build-package.sh -I -a aarch64`
          SUMMARY
