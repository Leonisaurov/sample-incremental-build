name: Build termux-sample

on:
  push:
    paths:
      - 'project/**'
      - 'packages/termux-sample/build.sh'
      - '.github/workflows/build.yml'
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/termux/package-builder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore build cache (incremental)
        id: cache
        uses: actions/cache@v4
        with:
          path: /home/builder/.termux-build
          key: termux-build-${{ hashFiles('project/**', 'packages/termux-sample/build.sh') }}
          restore-keys: |
            termux-build-

      - name: Ensure cache directory exists
        run: mkdir -p /home/builder/.termux-build

      - name: Fix NDK path (container HOME mismatch)
        run: |
          echo "Home is: $HOME"
          echo "Looking for NDK at expected paths..."
          if [ -d /home/builder/lib/android-ndk-r29 ]; then
            echo "Found NDK at /home/builder/lib/android-ndk-r29"
            mkdir -p /github/home/lib
            ln -sf /home/builder/lib/android-ndk-r29 /github/home/lib/android-ndk-r29
            echo "✅ NDK symlinked to /github/home/lib/android-ndk-r29"
          elif [ -d /home/builder/lib/android-ndk-r28 ]; then
            echo "Found NDK at /home/builder/lib/android-ndk-r28"
            mkdir -p /github/home/lib
            ln -sf /home/builder/lib/android-ndk-r28 /github/home/lib/android-ndk-r28
            echo "✅ NDK symlinked to /github/home/lib/android-ndk-r28"
          else
            echo "⚠️ NDK not found at expected paths. Searching..."
            find / -name "android-ndk-*" -maxdepth 5 -type d 2>/dev/null | head -5
            find /home/builder -name "ndk-*" -maxdepth 3 2>/dev/null | head -5
            ls -la /home/builder/lib/ 2>/dev/null || echo "No /home/builder/lib/"
          fi

      - name: Build package for aarch64
        run: |
          ./build-package.sh -I -a aarch64 termux-sample
        env:
          TERMUX_DOCKER_RUN_EXTRA_ARGS: --volume /home/builder/.termux-build:/home/builder/.termux-build

      - name: Collect artifact (.deb)
        if: always()
        run: |
          mkdir -p ./artifacts
          find /home/builder/.termux-build -name "*.deb" -exec cp {} ./artifacts/ \; 2>/dev/null || echo "No .deb found"
          ls -la ./artifacts/ 2>/dev/null || echo "No artifacts"

      - name: Upload .deb artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termux-sample-${{ github.sha }}
          path: ./artifacts/*.deb
          retention-days: 7

      - name: Build summary
        if: always()
        run: |
          cat <<'SUMMARY' >> $GITHUB_STEP_SUMMARY
          # 🏗️ Build termux-sample

          | Detalle | Valor |
          |---|---|
          | Commit | ${{ github.sha }} |
          | Branch | ${{ github.ref_name }} |
          | Arquitectura | aarch64 |
          | Cache key | `termux-build-${{ hashFiles('project/**', 'packages/termux-sample/build.sh') }}` |
          | Cache hit | ${{ steps.cache.outputs.cache-hit }} |

          ## 📁 Cambios en project/ que activaron el build
          ```
          ${{ github.event.before }} → ${{ github.sha }}
          ```

          ## 📦 Package: termux-sample
          - Source: `project/` (trackeado local)
          - Build: `build-package.sh -I -a aarch64`
          SUMMARY
