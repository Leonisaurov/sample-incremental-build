name: Build termux-sample

# Optimización #3: Trigger preciso (solo cambios relevantes)
on:
  push:
    paths:
      - 'project/**'
      - 'packages/termux-sample/build.sh'
      - '.github/workflows/build.yml'
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Volvemos a container: que es más rápido que docker save/load
    container:
      image: ghcr.io/termux/package-builder
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Cache #1: Toolchain + build system (key basada en build system)
      - name: Restore toolchain cache
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: /home/builder/.termux-build
          key: termux-toolchain-${{ hashFiles('packages/termux-sample/build.sh', 'packages/rust/build.sh') }}
          restore-keys: |
            termux-toolchain-

      # Cache #2: Cargo target/ (key basada en Cargo.lock — incremental REAL)
      - name: Restore cargo target cache (incremental)
        id: cache-cargo
        uses: actions/cache@v4
        with:
          path: /github/home/.termux-build/termux-sample/cargo-target
          key: cargo-target-${{ hashFiles('project/Cargo.lock') }}
          restore-keys: |
            cargo-target-

      - name: Ensure cache directories exist
        run: |
          mkdir -p /home/builder/.termux-build
          mkdir -p /github/home/.termux-build/termux-sample/cargo-target

      - name: Fix NDK path (container HOME mismatch)
        run: |
          if [ -d /home/builder/lib/android-ndk-r29 ]; then
            mkdir -p /github/home/lib
            ln -sf /home/builder/lib/android-ndk-r29 /github/home/lib/android-ndk-r29
            echo "✅ NDK symlinked"
          else
            echo "⚠️ NDK not found, searching..."
            find / -name "android-ndk-*" -maxdepth 5 -type d 2>/dev/null | head -3
          fi

      - name: Build package for aarch64
        run: |
          ./build-package.sh -I -a aarch64 termux-sample

      - name: Collect artifact (.deb)
        if: always()
        run: |
          mkdir -p ./artifacts
          find /home/builder/.termux-build -name "*.deb" -exec cp {} ./artifacts/ \; 2>/dev/null || echo "No .deb found"

      - name: Upload .deb artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termux-sample-${{ github.sha }}
          path: ./artifacts/*.deb
          retention-days: 7

      - name: Build summary
        if: always()
        run: |
          cat <<'SUMMARY' >> $GITHUB_STEP_SUMMARY
          # 🏗️ Build termux-sample

          | Detalle | Valor |
          |---|---|
          | Commit | ${{ github.sha }} |
          | Branch | ${{ github.ref_name }} |
          | Arquitectura | aarch64 |
          | Cache toolchain | ${{ steps.cache-toolchain.outputs.cache-hit }} |
          | Cache cargo (incremental) | ${{ steps.cache-cargo.outputs.cache-hit }} |
          | Trigger | Solo project/ y build.sh |

          ## 📁 Cambios que activaron el build
          ```
          ${{ github.event.before }} → ${{ github.sha }}
          ```
          SUMMARY
